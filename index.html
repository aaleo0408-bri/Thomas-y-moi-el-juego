  for(let y=0;y<h;y++)for(let x=0;x<w;x++){

    if(col){g.fillStyle=col;g.fillRect(x*scale,y*scale,scale,scale);}

  return c;
}

function burst(x,y,col,n,spd){for(let i=0;i<(n||14);i++){const a=Math.random()*TAU,s=(spd||150)*(0.4+Math.random());particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:.5+Math.random()*.5,t:0,col:col,size:2+Math.random()*3});}}

let buttons=[];
function addBtn(x,y,w,h,text,fn,opts){
  opts=opts||{};
  buttons.push({x:x,y:y,w:w,h:h,text:text,fn:fn,color:opts.color||'#f4bd5c',size:opts.size||22,disabled:!!opts.disabled,kind:opts.kind||'solid',icon:opts.icon||null});
}
function btnAt(px,py){
  for(let i=buttons.length-1;i>=0;i--){const b=buttons[i];
    if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h&&!b.disabled)return b;}
  return null;
}
function drawButton(b){
  const hov=hoverBtn===b;
  const dis=b.disabled;
  ctx.save();
  if(b.kind==='ghost'){
    ctx.globalAlpha=dis?0.35:(hov?1:0.82);
    roundRect(b.x,b.y,b.w,b.h,12);
    ctx.fillStyle='rgba(19,32,51,0.78)';ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle=hov?'#fff0cf':'#5d6b80';ctx.stroke();
    ctx.globalAlpha=1;
    ctx.fillStyle=dis?'#6b7688':(hov?'#fff0cf':'#d6dfd8');
  }else{
    ctx.globalAlpha=dis?0.45:1;
    const base=b.color;
    ctx.fillStyle='rgba(0,0,0,0.35)';
    roundRect(b.x,b.y+4,b.w,b.h,12);ctx.fill();
    ctx.fillStyle=dis?'#6f7683':(hov?lighten(base,.12):base);
    roundRect(b.x,b.y,b.w,b.h,12);ctx.fill();
    ctx.fillStyle=darken(base,.32);
    roundRect(b.x,b.y+b.h-8,b.w,8,4);ctx.fill();
    ctx.fillStyle='#192c3e';
  }
  ctx.font='bold '+b.size+'px system-ui';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(b.text,b.x+b.w/2,b.y+b.h/2-2);
  ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function lighten(hex,f){const c=hex2rgb(hex);return 'rgb('+Math.round(c[0]+(255-c[0])*f)+','+Math.round(c[1]+(255-c[1])*f)+','+Math.round(c[2]+(255-c[2])*f)+')';}
function darken(hex,f){const c=hex2rgb(hex);return 'rgb('+Math.round(c[0]*(1-f))+','+Math.round(c[1]*(1-f))+','+Math.round(c[2]*(1-f))+')';}
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
/* ================= niveles ================= */
function buildLevel(){
  const w=state.world,l=state.level,shift=(l*19)%120,length=2700;
  const gaps=[820+shift,1570+shift,2350+shift].map((x,i)=>({x:x,w:125+(i%2)*20}));
  const platforms=[];
  for(let i=0;i<10;i++){
    const x=160+i*(length-320)/9;
    platforms.push({x:x,y:455-(i%3)*26,w:170,h:20},{x:x+30,y:174+(i%3)*25,w:148,h:18});
  }
  const stars=[610,1370,2180].map((x,i)=>({x:x+(l*31%75),y:i%2===0?460:174,got:false}));
  for(const s of stars)for(const g of gaps)if(s.x>=g.x-25&&s.x<=g.x+g.w+25)s.x=g.x+g.w+65;
  const enemies=[960,1830].map((x,i)=>({x:x+(l*43%150),origin:x+(l*43%150),y:570,v:42+l*2.6+w*8,dir:i%2?-1:1,alive:true,fT:0}));
  const spikes=[];
  const spikeCount=clamp((l+w*3)/3|0,0,5);
  const placed=[];
  for(let i=0;i<spikeCount;i++){
    let sx=360+(i+1)*(length-720)/(spikeCount+1);
    for(const g of gaps)if(sx>=g.x-45&&sx<=g.x+g.w+45)sx=g.x+g.w+75;
    for(const s of stars)if(Math.abs(sx-s.x)<95)sx=s.x+110;
    for(const e of enemies)if(Math.abs(sx-e.origin)<85)sx+=95;
    for(const p of placed)if(Math.abs(sx-p)<80)sx+=95;
    sx=clamp(sx,300,length-260);
    let inGap=false;for(const g of gaps)if(sx>=g.x-35&&sx<=g.x+g.w+35)inGap=true;
    if(!inGap){placed.push(sx);spikes.push({x:sx});}
  }
  scene={w:w,l:l,length:length,gaps:gaps,platforms:platforms,stars:stars,enemies:enemies,spikes:spikes,
    player:{x:100,y:530,vx:0,vy:0,grav:1,onFloor:false,inv:0,coyote:0,buffer:0,runT:0,facing:1,dead:false},
    camX:0,ticks:0};
}

function isTouch(){return ('ontouchstart' in window)||navigator.maxTouchPoints>0;}
function pause(){if(!scene||scene.player.dead)return;screen='pause';buttons=[
  {x:365,y:300,w:200,h:62,text:'CONTINUAR',fn:()=>{screen='play';makeHud()},color:'#8dc69e',size:18},

function flip(){if(!scene||scene.player.dead||screen!=='play')return;const p=scene.player;p.grav*=-1;p.vy=-p.grav*90;p.coyote=0;burst(p.x,p.y,p.grav>0?'#85c7a5':'#bb91db',10,120);}
function jump(){const p=scene&&scene.player;if(!p||p.dead)return;if(p.onFloor||p.coyote>0){p.vy=-410*p.grav;p.onFloor=false;p.coyote=0;}else p.buffer=0.13;}

function die(){
  if(!scene||scene.player.dead)return;
  const p=scene.player;
  p.dead=true;
  state.lives=Math.max(0,state.lives-1);
  save();
  burst(p.x,p.y,'#e4463a',22,220);
  shake(9,0.4);
  if(state.lives<=0){
    screen='over';buttons=[];
    addBtn(340,326,220,64,'VOLVER AL MAPA',()=>{scene=null;showMap()},{color:'#8dc69e',size:18});
    addBtn(590,326,220,64,'NUEVA PARTIDA',()=>{newRun()},{color:'#f1c36a',size:18});
  }else{
    screen='lost';lostT=1.15;buttons=[];
    toastMsg='';toastT=0;
    setTimeout(()=>{ if(screen==='lost') respawn(); }, 1200);
  }
}
function newRun(){state.lives=5;state.world=0;state.level=0;state.stars={};scene=null;save();showMap();}
function finish(){
  if(!scene||scene.player.dead)return;
  const s=scene;
  const got=s.stars.filter(st=>st.got).length;
  state.stars[key(s.w,s.l)]=Math.max(earned(s.w,s.l),got);
  save();
  screen='results';resultT=0;buttons=[];
  addBtn(270,340,220,68,'MAPA DE MUNDOS',()=>{scene=null;showMap()},{color:'#8dc69e',size:18});
  addBtn(516,340,190,68,'REINTENTAR',()=>{startLevel()},{color:'#f1c36a',size:18});
  if(got===3){
    addBtn(730,340,205,68,'SIGUIENTE ➜',()=>{
      if(s.l<9){state.level=s.l+1;save();startLevel();}
      else if(s.w<2){state.world=s.w+1;state.level=0;save();showMap();}
      else{scene=null;showMap();}
    },{color:'#bd93dd',size:18});
  }
  if(got>=1)floatText(W/2,H*0.35,'¡NIVEL SUPERADO!','#fff0cf');
}

const MAP_PTS=[[180,210],[360,270],[540,188],[720,270],[900,195],[900,405],[720,455],[540,385],[360,470],[180,402]];
/* ================= update ================= */
function update(dt){
  time+=dt;
  if(toastT>0)toastT-=dt;
  if(shakeT>0)shakeT-=dt;
  fade=clamp(fade+fadeDir*dt*2.2,0,1);
  if(fade<=0&&fadeDir<0)fadeDir=0;
  for(let i=particles.length-1;i>=0;i--){const pt=particles[i];pt.t+=dt;if(pt.t>pt.life){particles.splice(i,1);continue;}pt.vy+=700*dt;pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;}
  for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];f.t+=dt;f.y-=34*dt;if(f.t>1.1)floaters.splice(i,1);}
  if(screen==='lost'){lostT-=dt;if(lostT<=0){respawn();toast('¡DE NUEVO!');}return;}
  if(screen!=='play'||!scene)return;
  const s=scene,p=s.player;
  if(p.dead){s.ticks+=dt;return;}
  s.ticks+=dt;
  p.vx=((held.right?1:0)-(held.left?1:0))*205;
  if(p.vx!==0)p.facing=p.vx>0?1:-1;
  p.vy=clamp(p.vy+1050*p.grav*dt,-650,650);
  const prevY=p.y;
  p.x=clamp(p.x+p.vx*dt,0,s.length-60);
  p.y+=p.vy*dt;
  p.onFloor=false;
  const wasFloor=p.onFloor;
  for(const pl of s.platforms){
    if(p.x+15>pl.x-pl.w/2&&p.x-15<pl.x+pl.w/2){
      const top=pl.y-pl.h/2,bottom=pl.y+pl.h/2;
      if(p.grav===1&&p.vy>=0&&p.y+23>=top&&prevY+23<=top+1){p.y=top-23;p.vy=0;p.onFloor=true;}
      if(p.grav===-1&&p.vy<=0&&p.y-23<=bottom&&prevY-23>=bottom-1){p.y=bottom+23;p.vy=0;p.onFloor=true;}
    }
  }
  let inGap=false;for(const g of s.gaps)if(p.x>g.x&&p.x<g.x+g.w)inGap=true;
  if(!inGap&&p.grav===1&&p.y>=596){p.y=596;p.vy=0;p.onFloor=true;}
  if(!inGap&&p.grav===-1&&p.y<=52){p.y=52;p.vy=0;p.onFloor=true;}
  p.coyote=p.onFloor?0.11:Math.max(0,p.coyote-dt);
  p.buffer=Math.max(0,p.buffer-dt);
  if(p.buffer>0&&p.coyote>0){p.vy=-410*p.grav;p.onFloor=false;p.coyote=0;p.buffer=0;}
  if(p.onFloor&&p.vx!==0){p.runT+=dt;}else if(p.vx===0)p.runT=0;
  if(p.inv>0)p.inv-=dt;
  /* estrellas */
  for(const st of s.stars){
    if(!st.got&&Math.abs(p.x-st.x)<25&&Math.abs(p.y-st.y)<35){
      st.got=true;burst(st.x,st.y,'#ffe45e',12,140);floatText(st.x,st.y-24,'★',' #ffe45e'.trim());
    }
  }
  /* enemigos */
  for(const e of s.enemies){
    if(!e.alive)continue;
    e.fT+=dt;
    e.x+=e.dir*e.v*dt;
    if(e.x<e.origin-72){e.x=e.origin-72;e.dir=1;}
    if(e.x>e.origin+72){e.x=e.origin+72;e.dir=-1;}
    if(Math.abs(p.x-e.x)<28&&Math.abs(p.y-e.y)<39){
      const falling=p.vy*p.grav>=0,above=(p.y-e.y)*p.grav<-15;
      if(falling&&above){e.alive=false;p.vy=-410*p.grav*.62;burst(e.x,e.y,worlds[s.w].enemy,12,160);floatText(e.x,e.y-30,'¡PLAF!','#fff0cf');shake(4,0.15);}
      else if(p.inv<=0){p.inv=0.5;die();}
    }
  }
  /* pinchos */
  for(const sp of s.spikes){
    if(p.inv<=0&&Math.abs(p.x-sp.x)<26&&p.grav===1&&Math.abs(p.y-596)<40){p.inv=0.5;die();}
  }
  if(p.y>760||p.y<-170){if(p.inv<=0){p.inv=0.5;die();}}
  const got=s.stars.filter(st=>st.got).length;
  if(p.x>s.length-115&&p.y>250&&p.y<380)finish();
  /* cámara */
  const target=clamp(p.x-W*0.45,0,s.length-W);
  s.camX+=(target-s.camX)*Math.min(1,dt*8);
}

function skyGradient(w){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,w.sky1);g.addColorStop(1,w.sky2);
  return g;
}
function drawClouds(w,scroll){
  ctx.fillStyle=w.cloud;
  ctx.globalAlpha=0.5;
  for(let i=0;i<7;i++){
    const cx=((i*397+120-scroll*0.25)%(W+320))-160;
    const cy=50+(i*67)%140;
    puff(cx,cy,1+(i%3)*0.35);
  }
  ctx.globalAlpha=1;
}
function puff(x,y,s){
  ctx.beginPath();
  ctx.arc(x,y,16*s,0,TAU);
  ctx.arc(x+18*s,y+4*s,12*s,0,TAU);
  ctx.arc(x-18*s,y+5*s,11*s,0,TAU);
  ctx.arc(x+4*s,y-8*s,11*s,0,TAU);
  ctx.fill();
}
function drawDeco(w,x,baseY,kind,scale){
  scale=scale||1;
  if(kind==='tree'){
    rectF(x,baseY-64*scale,10*scale,64*scale,'#5b4430');
    ctx.fillStyle=w.far2;
    ctx.beginPath();ctx.arc(x+5*scale,baseY-78*scale,26*scale,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(x-14*scale,baseY-62*scale,18*scale,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(x+24*scale,baseY-60*scale,16*scale,0,TAU);ctx.fill();
  }else if(kind==='building'){
    const h=(60+(x*7)%80)*scale;
    rectF(x,baseY-h,26*scale,h,w.far2);
    ctx.fillStyle=w.glow;
    for(let wy=0;wy<3;wy++)for(let wx=0;wx<2;wx++)
      if((x+wx*13+wy*29)%3!==0)ctx.fillRect(x+5*scale+wx*11*scale,baseY-h+8*scale+wy*16*scale,6*scale,8*scale);
  }else{
    ctx.fillStyle=w.glow;
    ctx.globalAlpha=0.85;
    ctx.beginPath();
    ctx.moveTo(x+8*scale,baseY);ctx.lineTo(x+16*scale,baseY-40*scale);ctx.lineTo(x+24*scale,baseY);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x-6*scale,baseY);ctx.lineTo(x,baseY-26*scale);ctx.lineTo(x+8*scale,baseY);
    ctx.fill();
    ctx.globalAlpha=1;
  }
}
function rectF(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function drawStarsCollected(s){
  for(const st of s.stars){
    if(st.got)continue;
    const tw=Math.sin(time*4+st.x)*2;
    ctx.save();
    ctx.translate(st.x,st.y+tw);
    ctx.drawImage(STAR_BIG,-10,-10);
    ctx.restore();

function drawHero(p){
  let spr=HERO_SPR.idle;
  if(!p.onFloor)spr=HERO_SPR.jump;
  else if(Math.abs(p.vx)>10)spr=(p.runT*10|0)%2?HERO_SPR.run1:HERO_SPR.run2;
  const bob=p.onFloor&&Math.abs(p.vx)<=10?Math.sin(time*3)*1.5:0;
  ctx.save();
  ctx.translate(Math.round(p.x),Math.round(p.y+bob));
  if(p.grav<0)ctx.scale(1,-1);
  if(p.facing<0)ctx.scale(-1,1);
  if(p.inv>0&&!p.dead)ctx.globalAlpha=0.4+0.3*Math.sin(time*30);
  ctx.drawImage(spr,-24,-54);
  ctx.restore();
}
function drawEnemies(s,w){
  for(const e of s.enemies){
    if(!e.alive)continue;
    const spr=(e.fT*6|0)%2?SLIME_SPR[s.w].a:SLIME_SPR[s.w].b;
    const sq=1+Math.sin(e.fT*6)*0.06;
    ctx.save();
    ctx.translate(Math.round(e.x),Math.round(e.y+16));

function drawSpikes(s,w){

function drawLevel(){
  const s=scene,w=worlds[s.w];

  ctx.save();
  ctx.translate(shx,shy);
  /* parallax lejano */
  for(let i=0;i<26;i++){
    const x=i*s.length/25-s.camX*0.4;
    if(x<-120||x>W+120)continue;
    drawDeco(w,x,560,w.deco,1);
  }
  for(let i=0;i<18;i++){

  }

  rectF(s.length/2-60,616,s.length,80,w.ground);

  }
  /* plataformas */
  for(const p of s.platforms){

  drawExit(s,w);

  ctx.restore();
  ctx.restore();
  /* partículas */
  for(const pt of particles){
    ctx.globalAlpha=1-pt.t/pt.life;
    ctx.fillStyle=pt.col;
    ctx.fillRect(pt.x-pt.size/2,pt.y-pt.size/2,pt.size,pt.size);

  ctx.globalAlpha=1;
  for(const f of floaters){

  /* HUD */
  drawHud(s);
}

/* ================= frame ================= */
function draw(){
  ctx.clearRect(0,0,W,H);
  if(screen==='title')drawTitle();
  else if(screen==='map')drawMapScreen();
  else if(screen==='play')drawLevel();
  else if(screen==='pause')drawPause();
  else if(screen==='lost')drawLost();
  else if(screen==='results')drawResults();
  else if(screen==='over')drawOver();
  if(toastT>0){
    ctx.globalAlpha=clamp(toastT,0,1);
    text(toastMsg,W/2,120,26,'#ffe45e');
    ctx.globalAlpha=1;
  }
  if(fade>0){ctx.fillStyle='rgba(9,13,24,'+fade+')';ctx.fillRect(0,0,W,H);}
  if(hoverBtn)cv.style.cursor='pointer';else cv.style.cursor='default';
}
function frame(now){
  let dt=Math.min(0.032,(now-(frame.last||now))/1000);
  frame.last=now;
  update(dt);
  if(screen==='results')resultT+=dt;
  draw();
  requestAnimationFrame(frame);
}
/* ================= entrada ================= */
function point(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
}
cv.addEventListener('pointermove',e=>{
  const p=point(e);mx=p.x;my=p.y;
  hoverBtn=btnAt(mx,my);
});
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const p=point(e);mx=p.x;my=p.y;
  pointerId=e.pointerId;
  try{cv.setPointerCapture(pointerId);}catch(err){}
  const b=btnAt(mx,my);
  if(b){
    if(b.touch==='left')held.left=true;
    else if(b.touch==='right')held.right=true;
    else if(b.touch==='jump')jump();
    else if(b.fn)b.fn();
    return;
  }
  if(screen==='map'){
    for(let i=0;i<MAP_PTS.length;i++){
      const q=MAP_PTS[i];
      if(Math.hypot(p.x-q[0],p.y-q[1])<36){
        if(worldUnlocked(state.world)&&levelUnlocked(state.world,i)&&state.lives>0){
          state.level=i;save();startLevel();
        }else toast('Bloqueado: consigue 3★ en el nivel anterior');
        return;
      }
    }
  }
});
function releasePointer(e){
  if(e&&pointerId!==null&&e.pointerId!==pointerId)return;
  held.left=false;held.right=false;pointerId=null;
}
cv.addEventListener('pointerup',releasePointer);
cv.addEventListener('pointercancel',releasePointer);
window.addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')held.left=true;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')held.right=true;
  if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();jump();}
  if(e.key==='g'||e.key==='G')flip();
  if(e.key==='Escape'&&screen==='play')pause();
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')held.left=false;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')held.right=false;
  if((e.key===' '||e.key==='ArrowUp')&&scene){
    const p=scene.player;
    if(!p.dead&&p.grav*p.vy<-120)p.vy=-120*p.grav;
  }
});
showTitle();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
