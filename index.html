<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101c2b">
<title>T / Gravity</title>
<style>
:root{color-scheme:dark;--sky:#9bd9d7;--deep:#101c2b;--ink:#192c3e;--leaf:#4e9b88;--earth:#654f39;--green:#8dc69e;--gold:#ffe36c;--red:#e4463a;--blue:#3568c7;--purple:#bb91db;--cream:#fff0cf}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--deep);font-family:system-ui,Segoe UI,sans-serif;color:var(--cream);touch-action:none}#game{display:block;width:100%;height:100%;image-rendering:pixelated}.hint{position:fixed;left:12px;top:10px;font-size:12px;opacity:.7;pointer-events:none}@media(max-height:480px){.hint{display:none}}
</style>
</head>
<body>
<canvas id="game" width="1152" height="648" aria-label="T / Gravity. Juego de plataformas de gravedad invertida"></canvas>
<div class="hint">PC: A/D o ←/→ · Salto: Espacio · Gravedad: G</div>
<script>
(()=>{
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const W=1152,H=648,worlds=[
{name:'BOSQUE SUSURRANTE',sub:'Donde despiertan las raíces',sky:'#9bd9d7',far:'#4e9b88',ground:'#654f39',plat:'#88ac69',glow:'#f7cf61',enemy:'#8d594c',map:'#203e3b'},
{name:'CIUDAD DE COBRE',sub:'La noche nunca duerme',sky:'#243b65',far:'#3b6080',ground:'#514b59',plat:'#697280',glow:'#f4bb63',enemy:'#df7556',map:'#28364c'},
{name:'INFRAMUNDO',sub:'Un eco bajo la tierra',sky:'#211e3d',far:'#443052',ground:'#49334a',plat:'#69506e',glow:'#70e6ca',enemy:'#e15b89',map:'#241d38'}],
levelNames=[['Sendero de brotes','Puentes de lianas','La charca espejo','Raíces cruzadas','Nido en la copa','Viento entre pinos','Troncos errantes','La gruta verde','Cima del rocío','Corazón del bosque'],['Avenida de cobre','Azoteas al alba','Cruce elevado','Túneles de neón','Obras nocturnas','Rieles fugaces','Torre de relojes','Lluvia eléctrica','El último tranvía','Cima metropolitana'],['Umbral de ceniza','Galería carmesí','Pozos de eco','Pilares flotantes','Río de brasas','Cripta invertida','La sala sin suelo','Escaleras del abismo','Trono de obsidiana','Núcleo profundo']];
const saveKey='tgravity-save-v1';let state={lives:5,stars:{},world:0,level:0};try{const s=JSON.parse(localStorage.getItem(saveKey)||'null');if(s&&s.v===1){state.lives=Math.max(0,Math.min(5,s.lives|0));state.stars=s.stars&&typeof s.stars==='object'?s.stars:{};state.world=Math.max(0,Math.min(2,s.world|0));state.level=Math.max(0,Math.min(9,s.level|0));}}catch(e){}
let screen='title',scene=null,pointer=null,held={left:false,right:false,jump:false};const key=(w,l)=>`${w}-${l}`,earned=(w,l)=>Math.max(0,Math.min(3,state.stars[key(w,l)]|0));function save(){try{localStorage.setItem(saveKey,JSON.stringify({v:1,lives:state.lives,stars:state.stars,world:state.world,level:state.level}));}catch(e){}}
function unlockedWorlds(){let n=1;for(let w=0;w<2;w++)if(earned(w,9)===3)n=w+2;return n}function unlocked(w,l){return w===0&&l===0||l>0&&earned(w,l-1)===3||l===0&&w>0&&earned(w-1,9)===3}
function button(x,y,w,h,text,fn,color='#f4bd5c',size=22){return{x,y,w,h,text,fn,color,size}}
let buttons=[];function addButton(x,y,w,h,text,fn,color,size){buttons.push(button(x,y,w,h,text,fn,color,size||22))}
function showTitle(){screen='title';buttons=[];addButton(430,330,292,65,'NUEVA PARTIDA',()=>{state.lives=5;state.world=0;state.level=0;save();showMap()},'#f4bd5c');if(state.lives<5)addButton(430,410,292,55,`CONTINUAR · ${state.lives} VIDAS`,showMap,'#8bcca0',18)}
function showMap(){screen='map';buttons=[];let w=state.world;addButton(36,290,64,64,'‹',()=>{if(state.world>0){state.world--;save();showMap()}},'#8dc69e',36);addButton(1052,290,64,64,'›',()=>{if(state.world<2&&state.world+1<unlockedWorlds()){state.world++;save();showMap()}},'#8dc69e',36);const points=[[180,210],[360,270],[540,188],[720,270],[900,195],[900,405],[720,455],[540,385],[360,470],[180,402]];points.forEach((p,i)=>{let u=unlocked(w,i)&&w<unlockedWorlds()&&state.lives>0;addButton(p[0]-29,p[1]-29,58,58,u?''+(i+1):'· ·',()=>{if(u){state.level=i;save();startLevel()}},u?worlds[w].glow:'#535b60',19);});addButton(28,572,132,48,'TÍTULO',showTitle,'#d39b76',16);if(state.lives<=0)addButton(973,570,160,50,'NUEVA PARTIDA',()=>{state.lives=5;state.world=0;state.level=0;save();showMap()},'#f4bd5c',14)}
function startLevel(){screen='play';buttons=[];const w=state.world,l=state.level,shift=(l*19)%120,length=2700;let gaps=[820+shift,1570+shift,2350+shift].map((x,i)=>({x,w:125+(i%2)*20}));let platforms=[];for(let i=0;i<10;i++){let x=160+i*(length-320)/9;platforms.push({x,y:455-(i%3)*26,w:170,h:20},{x:x+30,y:174+(i%3)*25,w:148,h:18});}let stars=[610,1370,2180].map((x,i)=>({x:x+(l*31%75),y:i%2===0?460:174,got:false}));for(const s of stars)for(const g of gaps)if(s.x>=g.x-25&&s.x<=g.x+g.w+25)s.x=g.x+g.w+65;let enemies=[960,1830].map((x,i)=>({x:x+(l*43%150),y:570,v:42+l*2.6+w*8,dir:i%2?-1:1,alive:true,origin:x+(l*43%150)}));scene={w,l,length,gaps,platforms,stars,enemies,player:{x:100,y:530,vx:0,vy:0,grav:1,onFloor:false,inv:0},ticks:0};buttons=[button(24,18,140,46,`♥ ${state.lives}`,()=>{},'#243449',22),button(180,18,175,46,'★ 0 / 3',()=>{},'#243449',20),button(1062,18,64,54,'Ⅱ',pause,'#d6dfd8',22),button(32,536,76,76,'◀',()=>held.left=true,'#f2c36c',29),button(122,536,76,76,'▶',()=>held.right=true,'#f2c36c',29),button(218,536,82,76,'▲',jump,'#85c7a5',29),button(1016,519,104,94,'↕',flip,'#bb91db',38)];}
function pause(){screen='pause';buttons=[];addButton(365,300,200,62,'CONTINUAR',()=>{screen='play';startLevelRestore()},'#8dc69e',18);addButton(590,300,200,62,'SALIR AL MAPA',showMap,'#f1c36a',18)}function startLevelRestore(){let s=scene;startLevel();scene=s;}
function flip(){if(!scene)return;scene.player.grav*=-1;scene.player.vy=-scene.player.grav*90;}
function jump(){if(scene&&scene.player.onFloor)scene.player.vy=-410*scene.player.grav;}
function die(){if(!scene||scene.dead)return;scene.dead=true;state.lives=Math.max(0,state.lives-1);save();if(!state.lives){screen='over';buttons=[];addButton(340,326,220,64,'VOLVER AL MAPA',showMap,'#8dc69e',18);addButton(590,326,220,64,'NUEVA PARTIDA',()=>{state.lives=5;state.world=0;state.level=0;save();showMap()},'#f1c36a',18)}else{screen='lost';buttons=[];setTimeout(()=>{if(screen==='lost')startLevel()},700)}}
function finish(){if(!scene||scene.dead)return;let stars=scene.stars.filter(s=>s.got).length;state.stars[key(scene.w,scene.l)]=Math.max(earned(scene.w,scene.l),stars);save();screen='results';buttons=[];addButton(270,340,220,68,'MAPA DE MUNDOS',showMap,'#8dc69e',18);addButton(516,340,190,68,'REINTENTAR',startLevel,'#f1c36a',18);if(stars===3)addButton(730,340,205,68,'SIGUIENTE →',()=>{if(scene.l<9){state.level=scene.l+1;startLevel()}else if(scene.w<2){state.world=scene.w+1;state.level=0;showMap()}else showMap()},'#bd93dd',18)}
function update(dt){if(screen!=='play'||!scene)return;scene.ticks+=dt;const p=scene.player;p.vx=(held.right?1:0)-(held.left?1:0);p.vx*=205;p.vy+=1050*p.grav*dt;p.vy=Math.max(-650,Math.min(650,p.vy));p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=Math.max(0,Math.min(scene.length-60,p.x));p.onFloor=false;let feetY=p.y+p.grav*23;for(const pl of scene.platforms){if(p.x+15>pl.x-pl.w/2&&p.x-15<pl.x+pl.w/2){let top=pl.y-pl.h/2,bottom=pl.y+pl.h/2;if(p.grav===1&&feetY>=top&&feetY-p.vy*dt<=top&&p.vy>=0){p.y=top-23;p.vy=0;p.onFloor=true}if(p.grav===-1&&p.y-23<=bottom&&p.y-23-p.vy*dt>=bottom&&p.vy<=0){p.y=bottom+23;p.vy=0;p.onFloor=true}}}let inGap=scene.gaps.some(g=>p.x>g.x&&p.x<g.x+g.w);if(!inGap&&p.grav===1&&p.y>596){p.y=596;p.vy=0;p.onFloor=true}if(!inGap&&p.grav===-1&&p.y<52){p.y=52;p.vy=0;p.onFloor=true}if(p.y>740||p.y< -150)die();for(const s of scene.stars)if(!s.got&&Math.abs(p.x-s.x)<25&&Math.abs(p.y-s.y)<35)s.got=true;for(const e of scene.enemies){if(!e.alive)continue;e.x+=e.dir*e.v*dt;if(Math.abs(e.x-e.origin)>72)e.dir*=-1;if(Math.abs(p.x-e.x)<28&&Math.abs(p.y-e.y)<39){let falling=p.vy*p.grav>=0,above=(p.y-e.y)*p.grav< -15;if(falling&&above){e.alive=false;p.vy=-410*p.grav*.62}else die()}}if(p.x>scene.length-115&&p.y>270&&p.y<365)finish();if(p.x>scene.length-60)finish();buttons[0].text=`♥ ${state.lives}`;buttons[1].text=`★ ${scene.stars.filter(s=>s.got).length} / 3`}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x-w/2),Math.round(y-h/2),w,h)}function text(t,x,y,size,color='#fff0cf',align='center'){ctx.fillStyle=color;ctx.font=`bold ${size}px system-ui`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(t,x,y)}
function drawHero(p){ctx.save();ctx.translate(Math.round(p.x),Math.round(p.y));if(p.grav<0)ctx.scale(1,-1);rect(0,3,29,23,'#e4463a');rect(0,1,9,9,'#ffd54f');rect(-7,22,12,20,'#3568c7');rect(7,22,12,20,'#3568c7');rect(-7,34,15,8,'#45bd69');rect(8,34,15,8,'#45bd69');rect(0,-14,21,17,'#e9bd91');rect(0,-24,23,8,'#68432d');rect(4,-15,3,3,'#28233a');rect(-8,-7,4,11,'#e9bd91');rect(9,-7,4,11,'#e9bd91');ctx.restore()}
function drawLevel(){let s=scene,w=worlds[s.w];ctx.fillStyle=w.sky;ctx.fillRect(0,0,W,H);for(let i=0;i<28;i++){let x=i*s.length/27-scene.player.x+W*.45;let h=80+(i*43%210);rect(x,280+h/2,90,h,w.far);rect(x+24,300+h/2,22,h+35,w.far)}ctx.save();ctx.translate(W*.45-scene.player.x,0);rect(s.length/2,632,s.length,32,w.ground);rect(s.length/2,16,s.length,28,w.ground);for(const g of s.gaps){rect(g.x+g.w/2,635,g.w,70,'#090d18');rect(g.x+97.5,25,125,46,'#090d18')}for(const p of s.platforms){rect(p.x,p.y,p.w,p.h,w.plat);rect(p.x,p.y-p.h/2+3,p.w,5,w.glow)}for(const star of s.stars)if(!star.got){ctx.fillStyle='#ffe45e';ctx.beginPath();for(let i=0;i<10;i++){let r=i%2?8:18,a=-Math.PI/2+i*Math.PI/5;ctx.lineTo(star.x+Math.cos(a)*r,star.y+Math.sin(a)*r)}ctx.closePath();ctx.fill()}for(const e of s.enemies)if(e.alive){rect(e.x,e.y,36,30,w.enemy);rect(e.x-7,e.y-3,5,5,'#fff');rect(e.x+7,e.y-3,5,5,'#fff');rect(e.x-7,e.y-3,2,3,'#111');rect(e.x+7,e.y-3,2,3,'#111')}rect(s.length-70,320,90,34,w.glow);rect(s.length-70,275,58,88,'#f5d46f');rect(s.length-70,275,34,62,'#253848');drawHero(s.player);ctx.restore();ctx.fillStyle='#132033b8';ctx.fillRect(340,12,475,48);text(`${w.name} · ${levelNames[s.w][s.l]}`,577,36,17);}
function drawMap(){let w=worlds[state.world];ctx.fillStyle=w.map;ctx.fillRect(0,0,W,H);for(let i=0;i<22;i++){let x=i*67-15,y=190+(i*53%340);rect(x,y,42,460-y,w.far)}text(w.name,W/2,48,30,'#fff0c8');text(w.sub,W/2,91,17,'#d6dfd8');text(`VIDAS ${state.lives} / 5`,30,43,20,'#ffdf81','left');const pts=[[180,210],[360,270],[540,188],[720,270],[900,195],[900,405],[720,455],[540,385],[360,470],[180,402]];ctx.strokeStyle='#ffffff55';ctx.lineWidth=8;ctx.beginPath();pts.forEach((p,i)=>{if(!i)ctx.moveTo(...p);else ctx.lineTo(...p)});ctx.stroke();pts.forEach((p,i)=>{let u=unlocked(state.world,i)&&state.world<unlockedWorlds();ctx.beginPath();ctx.arc(...p,29,0,Math.PI*2);ctx.fillStyle=u?w.glow:'#535b60';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=earned(state.world,i)===3?'#fff0bc':'#bfd0c3';ctx.stroke();text(u?''+(i+1):'· ·',p[0],p[1],19,'#192531');text('★'.repeat(earned(state.world,i))+'☆'.repeat(3-earned(state.world,i)),p[0],p[1]+40,14,'#ffe36c')} );text('3 estrellas desbloquean cada etapa',W/2,600,16,'#dce4d8');}
function drawButtons(){for(const b of buttons){ctx.globalAlpha=b.color==='#243449'?.82:1;ctx.fillStyle=b.color;ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,Math.min(14,b.h/4));ctx.fill();ctx.fillStyle=b.color==='#243449'?'#fff0cf':'#192c3e';ctx.font=`bold ${b.size}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.text,b.x+b.w/2,b.y+b.h/2);ctx.globalAlpha=1}}
function draw(){ctx.clearRect(0,0,W,H);if(screen==='map')drawMap();else if(screen==='play'||screen==='pause')drawLevel();else{ctx.fillStyle=screen==='title'?'#101c2b':'#111c2b';ctx.fillRect(0,0,W,H);if(screen==='title'){text('T / GRAVITY',W/2,150,58,'#ffe45e');text('UNA AVENTURA AL REVÉS',W/2,208,24,'#a9d2d2');text('Bosque · Ciudad · Inframundo',W/2,270,21)}else if(screen==='results'){text('¡NIVEL COMPLETADO!',W/2,126,34);let n=earned(state.world,state.level);text('★'.repeat(n)+'☆'.repeat(3-n),W/2,218,48,'#ffe36c');text(`${worlds[state.world].name} · ${levelNames[state.world][state.level]}`,W/2,286,19);text(`VIDAS RESTANTES ♥ ${state.lives}`,W/2,476,20)}else if(screen==='lost'){text('VIDA PERDIDA',W/2,280,34);text('Reintentando…',W/2,340,22)}else if(screen==='over'){text('FIN DE LA PARTIDA',W/2,210,38,'#f19078');text('Tus mundos siguen ahí. ¿Un nuevo intento?',W/2,275,20)}else if(screen==='pause'){drawLevel();ctx.fillStyle='#101827dd';ctx.fillRect(0,0,W,H);text('PAUSA',W/2,230,38)} }drawButtons()}
function frame(now){let dt=Math.min(.032,(now-(frame.last||now))/1000);frame.last=now;update(dt);draw();requestAnimationFrame(frame)}
function point(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();let p=point(e);pointer=e.pointerId;canvas.setPointerCapture(pointer);let b=buttons.findLast?.(b=>p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)||[...buttons].reverse().find(b=>p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h);if(b){if(screen==='play'&&['◀','▶','▲'].includes(b.text)){if(b.text==='◀')held.left=true;if(b.text==='▶')held.right=true;if(b.text==='▲')jump()}else b.fn();return}if(screen==='map'){let pts=[[180,210],[360,270],[540,188],[720,270],[900,195],[900,405],[720,455],[540,385],[360,470],[180,402]];let i=pts.findIndex(q=>Math.hypot(p.x-q[0],p.y-q[1])<36);if(i>=0&&unlocked(state.world,i)&&state.lives>0){state.level=i;startLevel()}}});canvas.addEventListener('pointerup',e=>{if(e.pointerId===pointer){held.left=false;held.right=false;held.jump=false;pointer=null}});canvas.addEventListener('pointercancel',()=>{held.left=false;held.right=false;held.jump=false});window.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')held.left=true;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')held.right=true;if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();jump()}if(e.key==='g'||e.key==='G')flip();if(e.key==='Escape'&&screen==='play')pause()});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')held.left=false;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')held.right=false});
showTitle();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
